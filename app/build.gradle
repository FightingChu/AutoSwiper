plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.autoswiper'
    compileSdk 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "com.example.autoswiper"
        minSdk 24
        targetSdk 33
        versionCode 3
        versionName "1.2"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 产物命名：debug -> AutoSwiper.apk，release -> AutoSwiper-release.apk
    applicationVariants.all { variant ->
        variant.outputs.all {
            def bt = variant.buildType.name
            outputFileName = (bt == "debug") ? "AutoSwiper.apk" : "AutoSwiper-${bt}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
